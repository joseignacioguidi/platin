name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platin
          POSTGRES_PASSWORD: platin
          POSTGRES_DB: platin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://platin:platin@localhost:5432/platin
      DIRECT_URL: postgresql://platin:platin@localhost:5432/platin
      TEST_DATABASE_URL: postgresql://platin:platin@localhost:5432/platin_test
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-with-at-least-32-characters
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm nx affected -t lint typecheck test build
