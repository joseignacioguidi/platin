services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platin
      POSTGRES_PASSWORD: platin
      POSTGRES_DB: platin
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platin']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
