<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>platin — Tu plata, más clara.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Sabé cuánto te queda libre este mes. Ingresos, gastos, tarjetas en cuotas y metas de ahorro, en pesos y dólares."
    />
    <meta name="theme-color" content="#00B99A" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="platin" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="platin — Tu plata, más clara." />
    <meta
      property="og:description"
      content="Cuánto te queda libre este mes, tus cuotas y tus metas, en pesos y dólares."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Applies the saved theme (or the system preference) before the first paint.
      try {
        var saved = localStorage.getItem('platin.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-canvas text-ink">
    <pl-root></pl-root>
  </body>
</html>
